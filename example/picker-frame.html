<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northline — frame fixture</title>
<style>
  :root { --ink: #101010; --paper: #f2f0ea; --muted: #6f6b62; --line: #d8d3c7; --accent: #b8492a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #faf9f4; color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
  }
  .frame-card { border: 1px dashed var(--line); margin: 18px; padding: 16px 18px; display: grid; gap: 9px; }
  .frame-card .mono { color: var(--accent); }
  .frame-card h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .frame-card p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .frame-card button {
    font: inherit; font-size: 13px; padding: 8px 16px; border-radius: 999px;
    border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    cursor: pointer; justify-self: start;
  }
  .frame-card button:hover { opacity: .85; }
</style>
</head>
<body>
  <div class="frame-card">
    <span class="mono">fig. 02 — a separate document</span>
    <h3>Centre punch</h3>
    <p>HSS, knurled body, 120&nbsp;mm. Restocks with the next batch.</p>
    <button type="button">Reserve one</button>
  </div>
</body>
</html>
